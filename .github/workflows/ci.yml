name: CI

# main went unbuildable for weeks after a TypeScript 7 bump (#10) because no
# workflow compiled pull requests. This one does, on the lowest supported Node.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test the CLI
        run: node dist/cli.js --help
